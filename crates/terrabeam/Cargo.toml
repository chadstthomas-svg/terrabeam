[package]
name = "terrabeam"
description = "One-command runner for Beam models: llama.cpp + engram library behind an OpenAI endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engram = { path = "../engram", default-features = false }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs", "io-util", "io-std", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
bytes = "1"

[features]
default = ["ort"]
ort = ["engram/ort"]
